# Render Blueprint Specification for Enterprise Garment WMS
# Automated Deployment with Managed PostgreSQL and Docker Web Service

services:
  # Web Application Service
  - type: web
    name: garment-wms-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: garment-wms-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: APP_JWT_SECRET
        generateValue: true

# Managed PostgreSQL Database
databases:
  - name: garment-wms-db
    databaseName: garment_wms
    user: garment_admin
    plan: starter
    region: oregon
