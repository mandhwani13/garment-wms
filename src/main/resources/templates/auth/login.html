<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Garment Manufacturing WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50/60 to-indigo-50/40 text-slate-700 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-200/80 p-8 space-y-6">
        <!-- Logo & Title -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-sky-100 text-sky-700 rounded-2xl shadow-sm">
                <i class="fa-solid fa-shirt text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-800">Garment WMS</h1>
            <p class="text-xs text-slate-500 font-medium">Apparel Warehouse &amp; Inventory Management</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 flex items-center">
            <i class="fa-solid fa-circle-exclamation mr-2 text-red-500"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>
        <div th:if="${logoutMessage}" class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-700 flex items-center">
            <i class="fa-solid fa-circle-check mr-2 text-emerald-500"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" id="username" name="username" required autofocus
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50/70 border border-slate-300 rounded-xl text-slate-800 text-xs focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition"
                           placeholder="Enter username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50/70 border border-slate-300 rounded-xl text-slate-800 text-xs focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition"
                           placeholder="Enter password">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs shadow-md shadow-sky-600/20 transition transform active:scale-98">
                Sign In to Terminal <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </form>

        <!-- Pre-seeded Quick Test Credentials Hint -->
        <div class="pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1.5">
            <div class="font-semibold text-slate-600 flex items-center text-[11px]">
                <i class="fa-solid fa-key mr-1.5 text-sky-500"></i> Pre-configured Test Accounts:
            </div>
            <div class="grid grid-cols-3 gap-2 pt-1 font-mono text-[11px]">
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200/80 text-center cursor-pointer hover:border-sky-400 hover:bg-sky-50/40 transition"
                     onclick="document.getElementById('username').value='master'; document.getElementById('password').value='master123';">
                    <div class="text-purple-700 font-bold">master</div>
                    <div class="text-slate-400 text-[10px]">master123</div>
                    <span class="text-[9px] text-slate-400 block">Master Admin</span>
                </div>
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200/80 text-center cursor-pointer hover:border-sky-400 hover:bg-sky-50/40 transition"
                     onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='admin123';">
                    <div class="text-sky-700 font-bold">admin</div>
                    <div class="text-slate-400 text-[10px]">admin123</div>
                    <span class="text-[9px] text-slate-400 block">Operations</span>
                </div>
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200/80 text-center cursor-pointer hover:border-sky-400 hover:bg-sky-50/40 transition"
                     onclick="document.getElementById('username').value='operator'; document.getElementById('password').value='operator123';">
                    <div class="text-emerald-700 font-bold">operator</div>
                    <div class="text-slate-400 text-[10px]">operator123</div>
                    <span class="text-[9px] text-slate-400 block">Scanner Floor</span>
                </div>
            </div>
            <p class="text-[10px] text-center text-slate-400 pt-1">Click any account tile above to autofill credentials</p>
        </div>
    </div>

</body>
</html>
