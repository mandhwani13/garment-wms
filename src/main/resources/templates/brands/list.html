<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: header_head('Brand Masters')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
    <header th:replace="~{layout/main :: navbar}"></header>
    <div th:replace="~{layout/main :: alerts}"></div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="space-y-6">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">Apparel Brands Master</h1>
                    <p class="text-xs text-slate-500">Manage apparel brands, brand-specific labels, patches, and finishing allocations.</p>
                </div>
                <button onclick="document.getElementById('modal-add-brand').classList.remove('hidden')"
                        class="inline-flex items-center px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow-xs transition">
                    <i class="fa-solid fa-plus mr-1.5"></i> Add New Brand
                </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
                <table class="min-w-full divide-y divide-slate-200/70 text-left text-xs">
                    <thead class="bg-slate-50 text-slate-500 uppercase font-semibold">
                        <tr>
                            <th class="px-6 py-3.5">Brand Code</th>
                            <th class="px-6 py-3.5">Brand Name</th>
                            <th class="px-6 py-3.5">Description</th>
                            <th class="px-6 py-3.5">Status</th>
                            <th class="px-6 py-3.5 text-right">Created Date</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white font-medium text-slate-700">
                        <tr th:each="b : ${brands}" class="hover:bg-slate-50/70 transition">
                            <td class="px-6 py-3.5 font-mono font-bold text-sky-700" th:text="${b.brandCode}">BR-01</td>
                            <td class="px-6 py-3.5 font-bold text-slate-800" th:text="${b.brandName}">Brand Name</td>
                            <td class="px-6 py-3.5 text-slate-500" th:text="${b.description}">Description</td>
                            <td class="px-6 py-3.5">
                                <span th:if="${b.active}" class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/60">ACTIVE</span>
                                <span th:unless="${b.active}" class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200/60">INACTIVE</span>
                            </td>
                            <td class="px-6 py-3.5 text-right text-slate-400 font-mono text-[11px]" th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd')}">Date</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(brands)}">
                            <td colspan="5" class="px-6 py-8 text-center text-slate-400">No brands registered yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Add Brand -->
            <div id="modal-add-brand" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200/80 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <h3 class="text-base font-bold text-slate-800">Register New Apparel Brand</h3>
                        <button onclick="document.getElementById('modal-add-brand').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>

                    <form th:action="@{/brands/create}" method="post" th:object="${newBrand}" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Brand Code *</label>
                            <input type="text" th:field="*{brandCode}" required placeholder="e.g. BR-DENIMCO"
                                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:ring-2 focus:ring-sky-500 focus:outline-hidden">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Brand Name *</label>
                            <input type="text" th:field="*{brandName}" required placeholder="e.g. DenimCo Premium"
                                   class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-hidden">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
                            <textarea th:field="*{description}" rows="2" placeholder="Apparel brand scope, styling guidelines..."
                                      class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 focus:outline-hidden"></textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                            <button type="button" onclick="document.getElementById('modal-add-brand').classList.add('hidden')"
                                    class="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-bold rounded-xl hover:bg-slate-50 transition">Cancel</button>
                            <button type="submit"
                                    class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-xl shadow-xs transition">Save Brand</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
