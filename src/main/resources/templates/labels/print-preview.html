<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Print Preview - ' + ${lot.lotNumber}">Print Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:inline="css">
        :root {
            --label-w: /*[[${widthMm} + 'mm']]*/ 50mm;
            --label-h: /*[[${heightMm} + 'mm']]*/ 38mm;
        }

        .label-sheet-item {
            width: var(--label-w);
            min-height: var(--label-h);
            max-height: var(--label-h);
            box-sizing: border-box;
            background: white;
            padding: 2.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @media screen {
            .screen-label-card {
                border: 1px dashed #94a3b8;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                margin: 8px;
                border-radius: 4px;
            }
        }

        @media print {
            @page {
                size: /*[[${widthMm} + 'mm ' + ${heightMm} + 'mm']]*/ 50mm 38mm;
                margin: 0;
            }
            body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .label-sheet-item {
                page-break-after: always !important;
                break-after: page !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

    <!-- Top Non-Printing Toolbar -->
    <header class="no-print bg-slate-900 text-white sticky top-0 z-50 shadow-md p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <a th:href="@{/lots/{id}(id=${lot.id})}" class="text-xs text-indigo-300 hover:text-white font-bold">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Lot
                </a>
                <span class="text-slate-600">|</span>
                <span class="text-sm font-bold text-white">
                    Lot: <span class="font-mono text-indigo-400" th:text="${lot.lotNumber}">LOT-01</span>
                </span>
                <span class="px-2 py-0.5 rounded text-[11px] bg-slate-800 text-slate-300 font-mono"
                      th:text="${cards.size() + ' labels'}">0 labels</span>
            </div>

            <!-- Size Selector & Filter Controls -->
            <form th:action="@{/labels/preview/{lotId}(lotId=${lot.id})}" method="get" class="flex flex-wrap items-center gap-2 text-xs">
                <!-- Size Presets -->
                <select name="sizePreset" onchange="this.form.submit()" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-2.5 py-1.5 font-bold">
                    <option value="50X25" th:selected="${sizePreset == '50X25'}">50mm x 25mm (Single Tag / Wash Care)</option>
                    <option value="50X38" th:selected="${sizePreset == '50X38'}">50mm x 38mm (Garment Price / Barcode)</option>
                    <option value="100X50" th:selected="${sizePreset == '100X50'}">100mm x 50mm (Master Bundle / Carton)</option>
                    <option value="CUSTOM" th:selected="${sizePreset == 'CUSTOM'}">Custom Dimensions</option>
                </select>

                <!-- Custom mm inputs if custom selected -->
                <div th:if="${sizePreset == 'CUSTOM'}" class="flex items-center gap-1">
                    <input type="number" step="0.5" name="customWidth" th:value="${widthMm}" placeholder="W mm" class="w-14 px-1.5 py-1 bg-slate-800 border border-slate-700 rounded text-white text-center">
                    <span>x</span>
                    <input type="number" step="0.5" name="customHeight" th:value="${heightMm}" placeholder="H mm" class="w-14 px-1.5 py-1 bg-slate-800 border border-slate-700 rounded text-white text-center">
                    <button type="submit" class="px-2 py-1 bg-indigo-600 rounded text-white font-bold">Set</button>
                </div>

                <!-- Item Filter -->
                <select name="type" onchange="this.form.submit()" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-2 py-1.5">
                    <option value="ALL" th:selected="${itemType == 'ALL'}">All Items (Sets + Pieces)</option>
                    <option value="SETS" th:selected="${itemType == 'SETS'}">Set Bundles Only</option>
                    <option value="PIECES" th:selected="${itemType == 'PIECES'}">Single Pieces Only</option>
                </select>

                <!-- Barcode Engine Format -->
                <select name="barcodeFormat" onchange="this.form.submit()" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-2 py-1.5">
                    <option value="CODE128" th:selected="${barcodeFormat == 'CODE128'}">Code 128 1D Barcode</option>
                    <option value="QR" th:selected="${barcodeFormat == 'QR'}">QR Code 2D</option>
                </select>

                <!-- Direct Native TSPL Download Link -->
                <a th:href="@{/labels/export/tspl/{lotId}(lotId=${lot.id}, sizePreset=${sizePreset}, type=${itemType})}"
                   class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg font-bold flex items-center"
                   title="Download TSPL raw thermal printer commands">
                    <i class="fa-solid fa-terminal mr-1"></i> TSPL .prn
                </a>

                <!-- BarTender CSV Link -->
                <a th:href="@{/labels/export/bartender/{lotId}(lotId=${lot.id}, type=${itemType})}"
                   class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold flex items-center">
                    <i class="fa-solid fa-file-csv mr-1"></i> BarTender CSV
                </a>

                <!-- Print Action Button -->
                <button type="button" onclick="window.print()"
                        class="px-4 py-1.5 bg-indigo-500 hover:bg-indigo-400 text-white font-black rounded-lg shadow-lg flex items-center">
                    <i class="fa-solid fa-print mr-1.5"></i> Print Now
                </button>
            </form>
        </div>
    </header>

    <!-- Labels Container Grid for Browser & Print -->
    <div class="print-container max-w-7xl mx-auto p-6 flex flex-wrap justify-center items-start">

        <div th:each="card : ${cards}" class="label-sheet-item screen-label-card">
            
            <!-- MASTER CARTON / BUNDLE PACK FORMAT (Width >= 90mm, e.g. 100x50mm) -->
            <div th:if="${widthMm >= 90}" class="h-full flex flex-col justify-between">
                <!-- Header -->
                <div class="border-b border-black pb-1 flex justify-between items-start">
                    <div>
                        <span class="text-[10px] font-black uppercase tracking-wider block" th:text="${card.itemType == 'SET' ? '[MASTER BUNDLE PACK]' : '[GARMENT PIECE TAG]'}">[MASTER BUNDLE]</span>
                        <div class="text-sm font-black leading-tight" th:text="${card.styleCode + ' - ' + card.designName}">Style - Design</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] font-bold block">LOT NO:</span>
                        <span class="font-mono text-xs font-black" th:text="${card.lotNo}">LOT-01</span>
                    </div>
                </div>

                <!-- Middle Content Details -->
                <div class="my-1 text-[11px] grid grid-cols-2 gap-2">
                    <div>
                        <div><b>COLOR:</b> <span th:text="${card.color}">Navy</span></div>
                        <div><b>PACK:</b> <span th:text="${card.setCode}">SET #1</span></div>
                    </div>
                    <div>
                        <div><b>SIZE:</b> <span th:text="${card.size}">ALL</span></div>
                        <div><b>RATIO:</b> <span class="text-[10px]" th:text="${card.setRatio}">Ratio</span></div>
                    </div>
                </div>

                <!-- Barcode & QR Code Section -->
                <div class="flex items-center justify-between pt-1 border-t border-black">
                    <div class="flex-1 mr-2 text-center">
                        <img th:if="${card.barcodeImageBase64 != null}" th:src="${card.barcodeImageBase64}" alt="Barcode" class="h-10 mx-auto barcode-img">
                        <span class="font-mono text-[10px] font-bold block" th:text="${card.barcode}">BARCODE</span>
                    </div>
                    <div th:if="${card.qrImageBase64 != null}" class="w-12 text-center">
                        <img th:src="${card.qrImageBase64}" alt="QR" class="w-12 h-12 mx-auto">
                    </div>
                </div>
            </div>

            <!-- COMPACT TAG FORMAT (50x25mm) -->
            <div th:if="${heightMm <= 28 and widthMm < 90}" class="h-full flex flex-col justify-between text-[9px] leading-tight">
                <div class="flex justify-between font-bold border-b border-slate-400 pb-0.5">
                    <span th:text="${card.styleCode}">STY-101</span>
                    <span>SZ: <b th:text="${card.size}">32</b></span>
                </div>
                <div class="text-[8px] truncate" th:text="${card.color + ' | Lot: ' + card.lotNo}">Color | Lot</div>
                <div class="text-center my-0.5">
                    <img th:if="${card.barcodeImageBase64 != null}" th:src="${card.barcodeImageBase64}" alt="Barcode" class="h-6 mx-auto barcode-img">
                    <img th:if="${card.barcodeImageBase64 == null and card.qrImageBase64 != null}" th:src="${card.qrImageBase64}" alt="QR" class="h-6 mx-auto">
                    <span class="font-mono text-[8px] block truncate font-bold" th:text="${card.barcode}">BARCODE</span>
                </div>
            </div>

            <!-- STANDARD GARMENT TAG FORMAT (50x38mm) -->
            <div th:if="${heightMm > 28 and widthMm < 90}" class="h-full flex flex-col justify-between text-[10px] leading-tight">
                <div class="border-b border-black pb-0.5">
                    <div class="flex justify-between font-black">
                        <span th:text="${card.styleCode}">STY-101</span>
                        <span class="px-1 bg-black text-white rounded text-[9px]" th:text="${card.size}">32</span>
                    </div>
                    <div class="text-[9px] text-slate-700 truncate" th:text="${card.designName}">Design</div>
                </div>

                <div class="my-1 flex justify-between text-[9px]">
                    <span>COL: <b th:text="${card.color}">Navy</b></span>
                    <span class="font-mono" th:text="'LOT:' + ${card.lotNo}">LOT</span>
                </div>

                <div class="text-center">
                    <img th:if="${card.barcodeImageBase64 != null}" th:src="${card.barcodeImageBase64}" alt="Barcode" class="h-8 mx-auto barcode-img">
                    <img th:if="${card.barcodeImageBase64 == null and card.qrImageBase64 != null}" th:src="${card.qrImageBase64}" alt="QR" class="h-10 mx-auto">
                    <span class="font-mono text-[9px] font-bold block tracking-tighter" th:text="${card.barcode}">BARCODE</span>
                </div>

                <div class="border-t border-slate-300 pt-0.5 text-[8px] text-slate-500 flex justify-between">
                    <span th:text="${card.setCode}">SET #1</span>
                    <span th:text="${card.itemType}">PIECE</span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
