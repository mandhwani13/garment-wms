<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:replace="~{layout/main :: html}" th:with="content=~{::#styles-content}, pageTitle='Style & Design Master'">
    <div id="styles-content" class="space-y-6">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-black text-slate-900">Styles &amp; Designs Master</h1>
                <p class="text-xs text-slate-500">Apparel style codes, silhouettes, categories, and fabric compositions.</p>
            </div>
            <button onclick="document.getElementById('modal-add-style').classList.remove('hidden')"
                    class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow transition">
                <i class="fa-solid fa-plus mr-1.5"></i> Add New Style
            </button>
        </div>

        <!-- Styles Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="min-w-full divide-y divide-slate-200 text-left text-xs">
                <thead class="bg-slate-50 text-slate-500 uppercase font-semibold">
                    <tr>
                        <th class="px-6 py-3.5">Style Code</th>
                        <th class="px-6 py-3.5">Design Name</th>
                        <th class="px-6 py-3.5">Category</th>
                        <th class="px-6 py-3.5">Fabric Details</th>
                        <th class="px-6 py-3.5 text-right">Created Date</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white font-medium text-slate-700">
                    <tr th:each="s : ${styles}" class="hover:bg-slate-50 transition">
                        <td class="px-6 py-3.5 font-mono font-bold text-indigo-700" th:text="${s.styleCode}">STY-101</td>
                        <td class="px-6 py-3.5 font-bold text-slate-900" th:text="${s.designName}">Design</td>
                        <td class="px-6 py-3.5">
                            <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-[11px] font-semibold" th:text="${s.category}">Category</span>
                        </td>
                        <td class="px-6 py-3.5 text-slate-600" th:text="${s.fabricDetails}">Fabric</td>
                        <td class="px-6 py-3.5 text-right text-slate-400 font-mono text-[11px]" th:text="${#temporals.format(s.createdAt, 'yyyy-MM-dd')}">Date</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(styles)}">
                        <td colspan="5" class="px-6 py-8 text-center text-slate-400">
                            No styles registered yet. Click "Add New Style" above.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Modal: Add New Style -->
        <div id="modal-add-style" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                    <h3 class="text-base font-bold text-slate-900">Add New Style / Design</h3>
                    <button onclick="document.getElementById('modal-add-style').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <form th:action="@{/styles/create}" th:object="${newStyle}" method="post" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Style Code *</label>
                        <input type="text" th:field="*{styleCode}" required placeholder="e.g. STY-404"
                               class="w-full px-3 py-2 border rounded-xl text-xs uppercase font-mono focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Design / Product Name *</label>
                        <input type="text" th:field="*{designName}" required placeholder="e.g. Vintage Washed Henley"
                               class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Category</label>
                        <input type="text" th:field="*{category}" placeholder="e.g. Shirts, Denim, Trousers"
                               class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Fabric Details</label>
                        <input type="text" th:field="*{fabricDetails}" placeholder="e.g. 100% Combed Slub Cotton"
                               class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="document.getElementById('modal-add-style').classList.add('hidden')"
                                class="px-4 py-2 border border-slate-300 text-slate-600 text-xs font-bold rounded-xl hover:bg-slate-50">Cancel</button>
                        <button type="submit"
                                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl">Save Style</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
